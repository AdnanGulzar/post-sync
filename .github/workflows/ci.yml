name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected needs history to diff against the base ref.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Derives NX_BASE / NX_HEAD so `nx affected` compares against the right commits.
      - uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: npm ci

      # @prisma/client's postinstall normally handles this, but `npm ci
      # --ignore-scripts` in a hardened runner would skip it; generating
      # explicitly keeps the typecheck honest either way.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npx nx affected -t lint --parallel=3

      - name: Typecheck
        run: npx nx affected -t typecheck --parallel=3

      - name: Test
        run: npx nx affected -t test --parallel=3

      - name: Build
        run: npx nx affected -t build --parallel=3
