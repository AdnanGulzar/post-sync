name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The publishing worker's recovery and claim guarantees are expressed in SQL
    # semantics (FOR UPDATE SKIP LOCKED, backdated timestamps) that a mock cannot
    # represent, so those tests need a real database. They skip when DATABASE_URL
    # is unset, which keeps a plain local `nx test api` working without Docker.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syncpost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syncpost_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/syncpost_test?schema=public

    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected needs history to diff against the base ref.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Derives NX_BASE / NX_HEAD so `nx affected` compares against the right commits.
      - uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: npm ci

      # @prisma/client's postinstall normally handles this, but `npm ci
      # --ignore-scripts` in a hardened runner would skip it; generating
      # explicitly keeps the typecheck honest either way.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to the test database
        run: npm run db:migrate:deploy

      - name: Lint
        run: npx nx affected -t lint --parallel=3

      - name: Typecheck
        run: npx nx affected -t typecheck --parallel=3

      - name: Test
        run: npx nx affected -t test --parallel=3

      - name: Build
        run: npx nx affected -t build --parallel=3
